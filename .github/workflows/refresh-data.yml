name: Refresh la-money-votes data

# Monthly automated refresh from the LA Ethics Commission's public
# Socrata API. This workflow NEVER pushes to main — it always opens (or
# updates) a pull request via peter-evans/create-pull-request, which a
# maintainer must review and merge by hand. See README "How refresh PRs are
# reviewed" and CONTRACT.md "Known limitations" for what to check before
# merging one, in particular: automated funding.json runs read from the
# public Socrata contributions dataset, which does not expose donor
# employer/occupation the way the manually-downloaded CSV export does (see
# build_funding.py's module docstring) — merging a refresh PR as-is will
# drop that field going forward. This is a known, currently-unresolved
# trade-off; see the PR body / build report for exactly which officials it
# affects on a given run.
#
# Prerequisite: this workflow's "Open or update data-refresh pull request"
# step needs the repo setting Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests"
# enabled, in addition to the `pull-requests: write` permission below. If
# that repo setting is off, peter-evans/create-pull-request fails with
# "GitHub Actions is not permitted to create or approve pull requests"
# even though the build itself succeeded — see the diagnostic step after it.
on:
  schedule:
    # Every Monday at 15:00 UTC. This is 08:00 Pacific during daylight
    # saving time and 07:00 Pacific during standard time. The gate below
    # permits the refresh only on the first Monday in America/Los_Angeles.
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One refresh at a time: every run writes the shared automated/data-refresh
# branch, so a second run waits for the first instead of racing it. The
# running refresh is never cancelled; GitHub keeps at most one pending run
# per group, so a newer queued run replaces an older pending one.
concurrency:
  group: refresh-data-automated-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: la-money-votes
    env:
      # Unique per invocation (and per re-run attempt). The build records it in
      # its report; verification below accepts only a report for this run.
      REFRESH_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to run the scheduled refresh
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: proceeding regardless of the date."
          else
            pacific_day="$(TZ=America/Los_Angeles date +%-d)"
            pacific_weekday="$(TZ=America/Los_Angeles date +%u)"
            if [ "$pacific_weekday" -eq 1 ] && [ "$pacific_day" -le 7 ]; then
              echo "run_refresh=true" >> "$GITHUB_OUTPUT"
              echo "First Monday in Pacific time: proceeding."
            else
              echo "run_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Not the first Monday in Pacific time: skipping refresh."
            fi
          fi

      - name: Set up Python
        if: steps.schedule.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove stale build reports
        if: steps.schedule.outputs.run_refresh == 'true'
        shell: bash
        run: rm -f -- build_report.json build_report.md

      - name: Run build_all.py against the live Socrata API
        id: build
        if: steps.schedule.outputs.run_refresh == 'true'
        # Keep going so diagnostics and verification run. This step's outcome
        # alone never authorizes the PR; only the verification step does.
        continue-on-error: true
        env:
          # Optional. The m6g2-gc6c / br3a-db9a datasets are public and work
          # without a token; set this repo secret only to raise Socrata's
          # anonymous rate limit if the monthly schedule ever needs it.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python3 scripts/build_all.py \
            --fetch-socrata \
            --run-id "$REFRESH_RUN_ID" \
            --report-path build_report.json \
            --markdown-path build_report.md

      - name: Verify this run's publication
        id: verify
        # Runs even after a build failure: a validated partial publication
        # is still verified and may be proposed. Fails (and fails the job) for
        # a missing, malformed, stale/foreign, dry-run, rolled-back or
        # recovery-required report, or for invalid committed data.
        if: ${{ !cancelled() && steps.schedule.outputs.run_refresh == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_all.py \
            --report-path build_report.json \
            --verify-run "$REFRESH_RUN_ID"
          python3 scripts/validate_data.py

      - name: Read build summary
        id: summary
        if: always() && steps.schedule.outputs.run_refresh == 'true'
        shell: bash
        run: |
          {
            echo 'body<<BUILD_REPORT_EOF'
            if [ -f build_report.md ]; then
              cat build_report.md
            else
              echo "(no build_report.md produced)"
            fi
            echo 'BUILD_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update data-refresh pull request
        id: pr
        # Only this run's verified publication may be proposed.
        if: ${{ !cancelled() && steps.schedule.outputs.run_refresh == 'true' && steps.verify.outcome == 'success' }}
        continue-on-error: true # surface the diagnostic below instead of a bare action failure
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/data-refresh
          delete-branch: true
          commit-message: "data: automated refresh from LA Ethics Commission API"
          title: "Automated data refresh (LA Ethics Commission)"
          body: |
            Automated monthly data refresh. **Do not merge without reading the build report below** — see README "How refresh PRs are reviewed".

            ${{ steps.summary.outputs.body }}
          add-paths: |
            la-money-votes/data/officials/**
            la-money-votes/data/freshness.json
          labels: automated-data-refresh

      - name: Diagnose PR-creation permission failure
        if: steps.schedule.outputs.run_refresh == 'true' && steps.pr.outcome == 'failure'
        run: |
          echo "::error::Could not open/update the data-refresh PR. This is almost" \
               "always a repo setting, not a code bug: enable Settings > Actions >" \
               "General > Workflow permissions > 'Allow GitHub Actions to create" \
               "and approve pull requests' (in addition to this workflow's own" \
               "'permissions: pull-requests: write'), then re-run this workflow."
          exit 1

      - name: Fail the job if the build itself failed
        if: ${{ !cancelled() && steps.schedule.outputs.run_refresh == 'true' && steps.build.outcome == 'failure' }}
        run: |
          echo "build_all.py reported failures -- see the opened/updated PR's build report for details."
          exit 1
